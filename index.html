<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Physics Simulator</title>

  <style>
    :root {
      color-scheme: dark;

      --background: #06101d;
      --surface: #0c1929;
      --surface-light: #14263d;
      --surface-hover: #1b4264;
      --border: #34506f;
      --primary: #39c7ff;
      --text: #f7fbff;
      --muted: #a2b4c8;

      font-family:
        Pretendard,
        "Noto Sans KR",
        Arial,
        sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-width: 320px;
      min-height: 100%;
    }

    body {
      margin: 0;
      background:
        radial-gradient(
          circle at 75% 0%,
          #123751,
          transparent 35%
        ),
        var(--background);

      color: var(--text);
    }

    /*
     * label 카드가 제어하는 체크박스입니다.
     * checked 상태이면 선택 창이 표시됩니다.
     */
    #modeWindow {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    /*
     * 운동 선택 창
     */
    #modeModal {
      position: fixed;
      z-index: 999999;
      inset: 0;

      padding: 22px;
      display: grid;
      place-items: center;

      background:
        radial-gradient(
          circle at 50% 10%,
          rgb(38 126 184 / 40%),
          transparent 44%
        ),
        rgb(2 8 18 / 96%);
    }

    /*
     * 체크박스가 해제되면 선택 창을 숨깁니다.
     * JavaScript를 사용하지 않습니다.
     */
    #modeWindow:not(:checked) + #modeModal {
      display: none;
    }

    .mode-dialog {
      width: min(1050px, 96vw);
      max-height: 92vh;

      padding: clamp(24px, 4vw, 42px);
      overflow-y: auto;

      border: 1px solid rgb(255 255 255 / 15%);
      border-radius: 25px;

      background:
        linear-gradient(
          145deg,
          #172f4b,
          #091a2e 60%,
          #06111f
        );

      box-shadow:
        0 40px 120px rgb(0 0 0 / 65%);
    }

    .eyebrow {
      margin: 0;

      color: var(--primary);
      text-align: center;

      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.15em;
    }

    .mode-dialog h1 {
      margin: 9px 0 10px;

      color: var(--text);
      text-align: center;

      font-size: clamp(1.7rem, 4vw, 2.8rem);
      letter-spacing: -0.04em;
    }

    .description {
      margin: 0 0 29px;

      color: var(--muted);
      text-align: center;
      font-size: 0.92rem;
    }

    .mode-grid {
      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 14px;
    }

    /*
     * 실제 클릭 영역입니다.
     * label을 누르면 #modeWindow 체크가 해제됩니다.
     */
    .mode-card {
      min-width: 0;
      min-height: 180px;

      padding: 23px 19px;

      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 11px;

      border: 1px solid var(--border);
      border-radius: 19px;

      background:
        linear-gradient(
          145deg,
          #102944,
          #081a2e
        );

      color: var(--text);

      cursor: pointer;
      user-select: none;
      touch-action: manipulation;

      transition:
        transform 150ms ease,
        border-color 150ms ease,
        background 150ms ease,
        box-shadow 150ms ease;
    }

    .mode-card:hover {
      transform: translateY(-6px);

      border-color: var(--primary);
      background:
        linear-gradient(
          145deg,
          #17476d,
          #0c2946
        );

      box-shadow:
        0 18px 45px rgb(0 0 0 / 35%);
    }

    .mode-card:active {
      transform: scale(0.98);
    }

    .mode-icon {
      min-width: 58px;
      height: 58px;
      padding: 0 9px;

      display: grid;
      place-items: center;

      border-radius: 16px;
      background: rgb(57 199 255 / 13%);

      color: var(--primary);
      font-size: 1.55rem;
      font-weight: 900;

      pointer-events: none;
    }

    .mode-card strong,
    .mode-card small {
      pointer-events: none;
    }

    .mode-card strong {
      font-size: 1.05rem;
    }

    .mode-card small {
      color: var(--muted);
      font-size: 0.77rem;
    }

    /*
     * 모달 뒤에 보이는 기본 페이지
     */
    header {
      min-height: 72px;
      padding: 12px 22px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;

      border-bottom: 1px solid var(--border);
      background: #081523;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .logo {
      width: 43px;
      height: 43px;

      display: grid;
      place-items: center;

      border-radius: 13px;

      background:
        linear-gradient(
          140deg,
          var(--primary),
          #5266ff
        );

      font-size: 1.3rem;
      font-weight: 900;
    }

    .brand h2 {
      margin: 0;
      font-size: 1.12rem;
    }

    .brand p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 0.73rem;
    }

    /*
     * label이므로 JavaScript 없이 창을 다시 엽니다.
     */
    .reopen-button {
      min-height: 40px;
      padding: 0 14px;

      display: grid;
      place-items: center;

      border: 1px solid var(--border);
      border-radius: 10px;

      background: var(--surface-light);
      color: var(--text);

      cursor: pointer;
      user-select: none;
    }

    .reopen-button:hover {
      border-color: var(--primary);
      background: var(--surface-hover);
    }

    main {
      min-height: calc(100vh - 72px);
      padding: 26px;

      display: grid;
      place-items: center;
    }

    .simulator-placeholder {
      width: min(1100px, 100%);
      min-height: 650px;

      padding: 26px;

      display: grid;
      place-items: center;

      border: 1px solid var(--border);
      border-radius: 20px;

      background:
        radial-gradient(
          circle at 50% 30%,
          #102c49,
          #040b14 65%
        );

      text-align: center;
    }

    .simulator-placeholder h2 {
      margin: 0 0 10px;
      font-size: 1.5rem;
    }

    .simulator-placeholder p {
      max-width: 620px;
      margin: 0;

      color: var(--muted);
      line-height: 1.7;
    }

    .success-badge {
      margin-bottom: 15px;
      padding: 8px 12px;

      border: 1px solid rgb(57 199 255 / 30%);
      border-radius: 999px;

      background: rgb(57 199 255 / 12%);
      color: #8be2ff;

      font-size: 0.75rem;
      font-weight: 700;
    }

    @media (max-width: 850px) {
      .mode-dialog {
        padding: 28px;
      }

      .mode-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .mode-card {
        min-height: 155px;
      }
    }

    @media (max-width: 520px) {
      #modeModal {
        padding: 8px;
      }

      .mode-dialog {
        width: 100%;
        padding: 22px 12px;
        border-radius: 18px;
      }

      .mode-grid {
        gap: 8px;
      }

      .mode-card {
        min-height: 135px;
        padding: 15px 12px;
        border-radius: 14px;
      }

      .mode-card small {
        display: none;
      }

      header {
        padding: 10px 12px;
      }

      .brand p {
        display: none;
      }

      .reopen-button {
        padding: 0 9px;
        font-size: 0.7rem;
      }

      main {
        padding: 12px;
      }

      .simulator-placeholder {
        min-height: 520px;
        padding: 18px;
      }
    }
  </style>
</head>

<body>
  <!--
    checked = 선택 창 열림
    카드 label 클릭 = 체크 해제 = 선택 창 닫힘
  -->
  <input
    id="modeWindow"
    type="checkbox"
    checked
    aria-hidden="true"
  >

  <!-- 체크박스 바로 다음에 있어야 합니다. -->
  <section id="modeModal">
    <div class="mode-dialog">
      <p class="eyebrow">INTERACTIVE PHYSICS LAB</p>

      <h1>어떤 운동을 시뮬레이션할까요?</h1>

      <p class="description">
        큰 버튼을 누르면 선택 창이 닫히고 실험실이 표시됩니다.
      </p>

      <div class="mode-grid">
        <label class="mode-card" for="modeWindow">
          <span class="mode-icon">↗</span>
          <strong>포물선 운동</strong>
          <small>발사 각도와 중력</small>
        </label>

        <label class="mode-card" for="modeWindow">
          <span class="mode-icon">↓</span>
          <strong>자유 낙하</strong>
          <small>높이와 중력가속도</small>
        </label>

        <label class="mode-card" for="modeWindow">
          <span class="mode-icon">▰</span>
          <strong>마찰 운동</strong>
          <small>수평면에서의 감속</small>
        </label>

        <label class="mode-card" for="modeWindow">
          <span class="mode-icon">≋</span>
          <strong>공기저항</strong>
          <small>이차 항력과 바람</small>
        </label>

        <label class="mode-card" for="modeWindow">
          <span class="mode-icon">● ●</span>
          <strong>충돌</strong>
          <small>두 물체의 질량과 속도</small>
        </label>

        <label class="mode-card" for="modeWindow">
          <span class="mode-icon">◢</span>
          <strong>빗면 운동</strong>
          <small>빗면 중력 성분과 마찰</small>
        </label>

        <label class="mode-card" for="modeWindow">
          <span class="mode-icon">↻</span>
          <strong>원운동</strong>
          <small>각속도와 구심가속도</small>
        </label>

        <label class="mode-card" for="modeWindow">
          <span class="mode-icon">⟲</span>
          <strong>돌림힘</strong>
          <small>τ = Iα 회전 운동</small>
        </label>

        <label class="mode-card" for="modeWindow">
          <span class="mode-icon">🚀</span>
          <strong>탈출 속도</strong>
          <small>중심천체의 역제곱 중력</small>
        </label>
      </div>
    </div>
  </section>

  <header>
    <div class="brand">
      <div class="logo">P</div>

      <div>
        <h2>Physics Simulator</h2>
        <p>당곡고 인터랙티브 물리 실험실</p>
      </div>
    </div>

    <!-- JavaScript 없이 선택 창 다시 열기 -->
    <label class="reopen-button" for="modeWindow">
      운동 다시 선택
    </label>
  </header>

  <main>
    <section class="simulator-placeholder">
      <div>
        <div class="success-badge">
          MODE SELECTOR READY
        </div>

        <h2>운동 선택 버튼이 정상 작동했습니다.</h2>

        <p>
          이 화면이 보인다면 시작 창의 클릭 기능과 GitHub Pages 배포는
          정상입니다. 오른쪽 위의 “운동 다시 선택”을 누르면 선택 창을
          다시 열 수 있습니다.
        </p>
      </div>
    </section>
  </main>
</body>
</html>
