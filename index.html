<!doctype html>

<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Physics Simulator</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #06101d;
      --panel: #0c1929;
      --panel2: #14263d;
      --border: #2f4868;
      --primary: #3bc8ff;
      --text: #f7fbff;
      --muted: #9fb1c5;
      --yellow: #ffda3d;
      --green: #43e6a1;
      --red: #ff667a;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-width: 320px;
      min-height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        Pretendard,
        "Noto Sans KR",
        Arial,
        sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      color: inherit;
      cursor: pointer;
    }

    header {
      min-height: 70px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      border-bottom: 1px solid var(--border);
      background: #081523;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      background: linear-gradient(140deg, var(--primary), #5366ff);
      font-size: 1.25rem;
      font-weight: 900;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.08rem;
    }

    .brand p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 0.72rem;
    }

    .header-button,
    .tool-button,
    .action-button {
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--panel2);
    }

    .header-button {
      min-height: 38px;
      padding: 0 13px;
    }

    button:hover {
      border-color: var(--primary);
      background: #1b3858;
    }

    .app {
      height: calc(100vh - 70px);
      min-height: 650px;
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
    }

    aside {
      padding: 17px;
      overflow-y: auto;
      border-right: 1px solid var(--border);
      background: #091625;
    }

    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 13px;
    }

    .panel-title h2 {
      margin: 0;
      font-size: 1.2rem;
    }

    #modeBadge {
      padding: 6px 9px;
      border: 1px solid rgb(59 200 255 / 30%);
      border-radius: 999px;
      background: rgb(59 200 255 / 12%);
      color: #83dfff;
      font-size: 0.67rem;
    }

    .control-card {
      margin-bottom: 9px;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
    }

    .control-card h3 {
      margin: 0 0 10px;
      font-size: 0.82rem;
    }

    label {
      margin-top: 9px;
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 600;
    }

    input,
    select {
      width: 100%;
      height: 38px;
      padding: 0 9px;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: 0;
      background: #06121f;
      color: var(--text);
    }

    input:focus,
    select:focus {
      border-color: var(--primary);
    }

    .input-unit {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #06121f;
    }

    .input-unit input {
      min-width: 0;
      border: 0;
      border-radius: 0;
    }

    .input-unit span {
      padding-right: 8px;
      color: #748a9f;
      font-size: 0.61rem;
      white-space: nowrap;
    }

    .two-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .check-label {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .check-label input {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
    }

    .mode-settings {
      display: none;
    }

    .mode-settings.active {
      display: block;
    }

    .actions {
      display: grid;
      grid-template-columns: 1.25fr 1fr 1fr;
      gap: 6px;
    }

    .action-button {
      min-height: 41px;
      font-size: 0.7rem;
      font-weight: 700;
    }

    .primary {
      border-color: #087fbe;
      background: linear-gradient(135deg, #087fbe, #176fd0);
    }

    #message {
      min-height: 37px;
      margin: 9px 0 0;
      padding: 9px;
      border-radius: 8px;
      background: rgb(255 255 255 / 4%);
      color: var(--muted);
      text-align: center;
      font-size: 0.67rem;
      line-height: 1.45;
    }

    #energyStatus {
      margin-top: 8px;
      padding: 8px;
      border-radius: 8px;
      text-align: center;
      font-size: 0.68rem;
      font-weight: 700;
      display: none;
    }

    #energyStatus.escape {
      display: block;
      color: #43e6a1;
      background: rgb(67 230 161 / 10%);
      border: 1px solid rgb(67 230 161 / 20%);
    }

    #energyStatus.bound {
      display: block;
      color: #ff667a;
      background: rgb(255 102 122 / 10%);
      border: 1px solid rgb(255 102 122 / 20%);
    }

    #energyStatus.minimum {
      display: block;
      color: #ffda3d;
      background: rgb(255 218 61 / 10%);
      border: 1px solid rgb(255 218 61 / 20%);
    }

    .simulation {
      position: relative;
      min-width: 0;
      min-height: 650px;
      overflow: hidden;
      background: #020811;
    }

    #canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    .tools {
      position: absolute;
      z-index: 5;
      top: 15px;
      left: 50%;
      padding: 5px;
      display: flex;
      gap: 5px;
      transform: translateX(-50%);
      border: 1px solid rgb(255 255 255 / 12%);
      border-radius: 11px;
      background: rgb(7 19 34 / 84%);
    }

    .tool-button {
      min-width: 37px;
      height: 34px;
      padding: 0 9px;
    }

    .tools input[type="range"] {
      width: 110px;
      height: 34px;
      padding: 0;
      accent-color: var(--primary);
      background: transparent;
      border: 0;
    }

    .overlay {
      position: absolute;
      z-index: 4;
      top: 15px;
      width: 270px;
      max-height: calc(100% - 80px);
      padding: 12px;
      overflow-y: auto;
      border: 1px solid rgb(255 255 255 / 12%);
      border-radius: 12px;
      background: rgb(5 14 27 / 80%);
      backdrop-filter: blur(9px);
    }

    .formula-card {
      left: 15px;
      color: #ffe36c;
    }

    .info-card {
      right: 15px;
    }

    .overlay-title {
      margin-bottom: 9px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      color: white;
      font-size: 0.7rem;
    }

    .overlay-title button {
      min-height: 27px;
      padding: 3px 7px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--panel2);
      color: white;
      font-size: 0.61rem;
    }

    #formulaText {
      margin: 0;
      white-space: pre-wrap;
      font: 0.66rem/1.65 Consolas, monospace;
    }

    .physics-row {
      padding: 4px 0;
      display: grid;
      grid-template-columns: minmax(70px, 1fr) auto;
      gap: 8px;
      border-bottom: 1px solid rgb(255 255 255 / 6%);
      font-size: 0.65rem;
    }

    .physics-name {
      color: #a8bacd;
    }

    .physics-value {
      color: #71dcff;
      text-align: right;
      white-space: nowrap;
    }

    .energy-positive {
      color: var(--green) !important;
    }

    .energy-negative {
      color: var(--red) !important;
    }

    .energy-zero {
      color: var(--yellow) !important;
    }

    .escape-help {
      margin-top: 9px;
      padding: 9px;
      border-radius: 8px;
      background: rgb(59 200 255 / 7%);
      color: var(--muted);
      font-size: 0.64rem;
      line-height: 1.55;
    }

    .escape-help strong {
      color: #83dfff;
    }

    /* 운동 선택 모달 */

    .modal {
      position: fixed;
      z-index: 999999;
      inset: 0;
      padding: 20px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 10%, rgb(33 119 177 / 40%), transparent 45%),
        rgb(2 8 18 / 96%);
    }

    .modal.hidden {
      display: none;
    }

    .mode-dialog {
      position: relative;
      width: min(980px, 96vw);
      max-height: 92vh;
      padding: clamp(24px, 4vw, 42px);
      overflow-y: auto;
      border: 1px solid rgb(255 255 255 / 15%);
      border-radius: 24px;
      background: linear-gradient(145deg, #172f4b, #091a2e 60%, #06111f);
    }

    .version-badge {
      position: absolute;
      top: 14px;
      left: 18px;
      color: rgb(255 255 255 / 35%);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      pointer-events: none;
    }

    .mode-dialog h2 {
      margin: 7px 0 8px;
      text-align: center;
      font-size: clamp(1.6rem, 4vw, 2.5rem);
    }

    .mode-dialog > p {
      margin: 0 0 25px;
      color: var(--muted);
      text-align: center;
    }

    .mode-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 13px;
    }

    .mode-button {
      min-height: 145px;
      padding: 20px 17px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 9px;
      border: 1px solid #354e6f;
      border-radius: 17px;
      background: linear-gradient(145deg, #102944, #081a2e);
      text-align: left;
    }

    .mode-button:hover {
      transform: translateY(-4px);
      border-color: var(--primary);
      background: #164569;
    }

    .mode-button span {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: rgb(59 200 255 / 13%);
      color: var(--primary);
      font-size: 1.4rem;
    }

    .mode-button small {
      color: var(--muted);
    }

    /* 공식 설명 모달 */

    .formula-dialog {
      width: min(650px, 96vw);
      max-height: 90vh;
      padding: 22px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: #0b192b;
    }

    .dialog-heading {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .dialog-heading h2 {
      margin: 0;
    }

    .close-button {
      width: 37px;
      height: 37px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--panel2);
    }

    #formulaDescription {
      margin-top: 16px;
      color: #d7e3f1;
      line-height: 1.75;
    }

    #formulaDescription pre {
      padding: 12px;
      border-radius: 9px;
      background: #06121f;
      color: #ffe36c;
      white-space: pre-wrap;
    }

    @media (max-width: 850px) {
      .app {
        grid-template-columns: 300px minmax(0, 1fr);
      }

      .overlay {
        width: 215px;
      }
    }

    @media (max-width: 700px) {
      body {
        overflow: auto;
      }

      .app {
        height: auto;
        display: flex;
        flex-direction: column;
      }

      .simulation {
        order: 1;
        height: 62vh;
        min-height: 500px;
      }

      aside {
        order: 2;
        overflow: visible;
        border-top: 1px solid var(--border);
        border-right: 0;
      }

      .overlay {
        top: auto;
        bottom: 8px;
        width: calc(50% - 10px);
        max-height: 180px;
        padding: 8px;
      }

      .formula-card {
        left: 5px;
      }

      .info-card {
        right: 5px;
      }

      .mode-grid {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .mode-button {
        min-height: 120px;
      }
    }
  </style>


<script>
/* v1.4.2.1: keep escape-velocity initial speed controls synchronized with the simulation */
(function () {
  function syncEscapeInitialSpeed() {
    const selectors = [
      '#escapeInitialSpeed', '#initialSpeed', '#escape-speed',
      '[name="escapeInitialSpeed"]', '[name="initialSpeed"]'
    ];
    let el = null;
    for (const s of selectors) {
      el = document.querySelector(s);
      if (el) break;
    }
    if (!el) return;

    const value = Number(el.value);
    if (!Number.isFinite(value)) return;

    // Update common global/state variable names used by the simulator.
    if (typeof window.initialSpeed !== 'undefined') window.initialSpeed = value;
    if (typeof window.escapeInitialSpeed !== 'undefined') window.escapeInitialSpeed = value;
    if (typeof window.v0 !== 'undefined') window.v0 = value;
    if (typeof window.initialVelocity !== 'undefined') window.initialVelocity = value;

    // Update matching output labels.
    document.querySelectorAll(
      '#escapeInitialSpeedValue, #initialSpeedValue, [data-for="escapeInitialSpeed"], [data-for="initialSpeed"]'
    ).forEach(out => out.textContent = value);
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll(
      '#escapeInitialSpeed, #initialSpeed, #escape-speed, [name="escapeInitialSpeed"], [name="initialSpeed"]'
    ).forEach(el => {
      el.addEventListener('input', syncEscapeInitialSpeed);
      el.addEventListener('change', syncEscapeInitialSpeed);
    });
    syncEscapeInitialSpeed();
  });
})();
</script>

</head>

<body>

  <!-- 운동 선택 -->

  <div id="modeModal" class="modal">
    <section class="mode-dialog">
      <span class="version-badge">v1.4.2</span>


  <h2>어떤 운동을 시뮬레이션할까요?</h2>
  <p>운동을 선택하면 초기 설정이 적용됩니다.</p>

  <div class="mode-grid">
    <button class="mode-button" type="button" data-mode="projectile">
      <span>↗</span>
      <strong>포물선 운동</strong>
      <small>발사 속도, 각도, 중력</small>
    </button>

    <button class="mode-button" type="button" data-mode="freefall">
      <span>↓</span>
      <strong>자유 낙하</strong>
      <small>시작 높이와 중력가속도</small>
    </button>

    <button class="mode-button" type="button" data-mode="friction">
      <span>▰</span>
      <strong>마찰 운동</strong>
      <small>수평면 마찰에 의한 감속</small>
    </button>

    <button class="mode-button" type="button" data-mode="circular">
      <span>↻</span>
      <strong>원운동</strong>
      <small>반지름과 각속도</small>
    </button>

    <button class="mode-button" type="button" data-mode="incline">
      <span>◺</span>
      <strong>빗면 운동</strong>
      <small>경사각과 마찰에 의한 가속</small>
    </button>

    <button class="mode-button" type="button" data-mode="escape">
      <span>🚀</span>
      <strong>탈출 속도</strong>
      <small>역학적 에너지로 탈출 여부 확인</small>
    </button>
  </div>
</section>


  </div>

  <!-- 공식 설명 -->

  <div id="formulaModal" class="modal hidden">
    <section class="formula-dialog">
      <div class="dialog-heading">
        <h2 id="formulaTitle">공식 설명</h2>
        <button id="closeFormula" class="close-button" type="button">×</button>
      </div>


  <div id="formulaDescription"></div>
</section>


  </div>

  <header>
    <div class="brand">
      <div class="logo">P</div>
      <div>
        <h1>Physics Simulator</h1>
        <p>인터랙티브 물리 실험실 · v1.4.2</p>
      </div>
    </div>


<button id="openMode" class="header-button" type="button">
  운동 다시 선택
</button>


  </header>

  <main class="app">


<aside>

  <div class="panel-title">
    <h2>실험 설정</h2>
    <span id="modeBadge">포물선 운동</span>
  </div>

  <!-- 운동과 환경 -->
  <section class="control-card">
    <h3>운동과 환경</h3>

    <label>
      운동 종류
      <select id="mode">
        <option value="projectile">포물선 운동</option>
        <option value="freefall">자유 낙하</option>
        <option value="friction">마찰 운동</option>
        <option value="circular">원운동</option>
        <option value="incline">빗면 운동</option>
        <option value="escape">탈출 속도</option>
      </select>
    </label>

    <label>
      중력 환경
      <select id="gravity">
        <option value="9.8">지구 · 9.8 m·s⁻²</option>
        <option value="1.62">달 · 1.62 m·s⁻²</option>
        <option value="3.72">화성 · 3.72 m·s⁻²</option>
        <option value="0">무중력 · 0 m·s⁻²</option>
      </select>
    </label>
  </section>

  <!-- 초기 조건 -->
  <section class="control-card">
    <h3>초기 조건</h3>

    <div class="two-columns">

      <label>
        초기 속력 v₀
        <div class="input-unit">
          <input id="speed" type="number" value="15" step="0.1">
          <span>m·s⁻¹</span>
        </div>
      </label>

      <label>
        질량 m
        <div class="input-unit">
          <input id="mass" type="number" value="1" min="0.01" step="0.1">
          <span>kg</span>
        </div>
      </label>

    </div>

    <label>
      발사 각도 θ
      <div class="input-unit">
        <input id="angle" type="number" value="60" step="1">
        <span>°</span>
      </div>
    </label>

    <div class="two-columns">

      <label>
        추가 가속도 aₓ
        <div class="input-unit">
          <input id="accelerationX" type="number" value="0" step="0.1">
          <span>m·s⁻²</span>
        </div>
      </label>

      <label>
        추가 가속도 aᵧ
        <div class="input-unit">
          <input id="accelerationY" type="number" value="0" step="0.1">
          <span>m·s⁻²</span>
        </div>
      </label>

    </div>
  </section>

  <!-- 모드별 설정 -->
  <section class="control-card">
    <h3>모드별 설정</h3>

    <div id="freefallSettings" class="mode-settings">

      <label>
        시작 높이 h₀
        <div class="input-unit">
          <input id="freefallHeight" type="number" value="25" min="1" step="1">
          <span>m</span>
        </div>
      </label>

    </div>

    <div id="frictionSettings" class="mode-settings">

      <label>
        운동마찰계수 μₖ
        <input id="frictionCoefficient" type="number" value="0.3" min="0" step="0.01">
      </label>

    </div>

    <div id="circularSettings" class="mode-settings">

      <label>
        반지름 r
        <div class="input-unit">
          <input id="radius" type="number" value="10" min="1" step="0.5">
          <span>m</span>
        </div>
      </label>

      <label>
        각속도 ω
        <div class="input-unit">
          <input id="angularVelocity" type="number" value="1" step="0.1">
          <span>rad·s⁻¹</span>
        </div>
      </label>

    </div>

    <div id="inclineSettings" class="mode-settings">

      <label>
        경사각 φ
        <div class="input-unit">
          <input id="inclineAngle" type="number" value="30" min="0" max="89" step="1">
          <span>°</span>
        </div>
      </label>

      <label>
        정지/운동마찰계수 μ
        <input id="inclineFriction" type="number" value="0.2" min="0" step="0.01">
      </label>

    </div>

    <div id="escapeSettings" class="mode-settings">

      <label>
        표면 중력가속도 g₀
        <div class="input-unit">
          <input id="planetGravity" type="number" value="9.8" min="0.01" step="0.1">
          <span>m·s⁻²</span>
        </div>
      </label>

      <label>
        천체 반지름 R
        <div class="input-unit">
          <input id="planetRadius" type="number" value="35" min="1" step="0.5">
          <span>m</span>
        </div>
      </label>

      <label class="check-label">
        <input id="useEscapeSpeed" type="checkbox" checked>
        계산된 탈출 속도로 발사
      </label>

      <label>
        시점
        <select id="escapeView">
          <option value="planet">행성 고정 (물체가 움직입니다)</option>
          <option value="object">물체 고정 (행성이 움직입니다)</option>
        </select>
      </label>

      <div class="escape-help">
        <strong>탈출 조건</strong><br>
        E = K + U<br>
        E &gt; 0 : 탈출<br>
        E = 0 : 최소 탈출 조건<br>
        E &lt; 0 : 다시 행성으로 낙하
      </div>

    </div>

    <p id="noExtraSettings" style="color:var(--muted);font-size:.72rem;">
      추가 설정이 필요하지 않습니다.
    </p>
  </section>

  <!-- 에너지 상태 -->
  <div id="energyStatus"></div>

  <!-- 표시 설정 -->
  <section class="control-card">
    <h3>표시 설정</h3>

    <label class="check-label">
      <input id="showTrail" type="checkbox" checked>
      운동 경로 표시
    </label>
  </section>

  <!-- 버튼 -->
  <div class="actions">

    <button id="start" class="action-button primary" type="button">
      ▶ 처음부터
    </button>

    <button id="playPause" class="action-button" type="button">
      ▶ 재생
    </button>

    <button id="reset" class="action-button" type="button">
      ↻ 초기화
    </button>

  </div>

  <p id="message">
    운동을 선택하고 실행해 주세요.
  </p>

</aside>

<!-- 시뮬레이션 -->
<section id="simulation" class="simulation">

  <canvas id="canvas"></canvas>

  <div class="tools">

    <button id="zoomOut" class="tool-button" type="button">
      −
    </button>

    <input
      id="zoomSlider"
      type="range"
      min="0"
      max="100"
      value="50"
      step="0.1"
    >

    <button id="zoomIn" class="tool-button" type="button">
      ＋
    </button>

    <button id="fitView" class="tool-button" type="button">
      화면 맞춤
    </button>

  </div>

  <div class="overlay formula-card">

    <div class="overlay-title">
      <strong>적용 공식</strong>

      <button id="showFormula" type="button">
        공식 설명
      </button>
    </div>

    <pre id="formulaText"></pre>

  </div>

  <div class="overlay info-card">

    <div class="overlay-title">
      <strong>실시간 물리량</strong>
    </div>

    <div id="physicsInfo"></div>

  </div>

</section>


  </main>

  <script>
    "use strict";

    const MODES = {

      projectile: {
        name: "포물선 운동",
        speed: 15,
        angle: 60,

        formula:
`x = x₀ + v₀cosθ·t
y = y₀ + v₀sinθ·t − ½gt²
F⃗g = m g⃗`,

        explanation:
          "수평 방향에는 사용자가 추가한 가속도 aₓ가 작용하고, " +
          "수직 방향에는 중력가속도 −g와 추가 가속도 aᵧ가 작용합니다."
      },

      freefall: {
        name: "자유 낙하",
        speed: 0,
        angle: 270,

        formula:
`vᵧ = v₀ᵧ − gt
y = y₀ + v₀ᵧt − ½gt²`,

        explanation:
          "물체가 중력의 영향으로 수직 낙하합니다. " +
          "공기저항을 무시하면 질량과 관계없이 같은 중력가속도를 갖습니다."
      },

      friction: {
        name: "마찰 운동",
        speed: 15,
        angle: 0,

        formula:
`fₖ = μₖN = μₖmg
aₓ = −μₖg·sgn(vₓ)`,

        explanation:
          "운동마찰력은 수직항력 N에 비례하며 물체의 운동 방향과 반대로 작용합니다."
      },

      circular: {
        name: "원운동",
        speed: 10,
        angle: 0,

        formula:
`v = rω
a꜀ = rω² = v²/r
F꜀ = mrω²`,

        explanation:
          "속력은 일정하지만 속도 방향이 계속 변하므로 " +
          "원의 중심을 향하는 구심가속도와 구심력이 존재합니다."
      },

      incline: {
        name: "빗면 운동",
        speed: 0,
        angle: 0,

        formula:
`a = g sinφ − μg cosφ
N = mg cosφ
fₖ = μN`,

        explanation:
          "빗면에 놓인 물체는 중력의 빗면 방향 성분에 의해 가속되고, " +
          "마찰력은 운동 방향과 반대로 작용합니다."
      },

      escape: {
        name: "탈출 속도",
        speed: 26.19,
        angle: 90,

        formula:
`v_escape = √(2g₀R)
U = −GMm/r
E = K + U

E > 0  → 탈출
E = 0  → 최소 탈출
E < 0  → 탈출 불가`,

        explanation:
          "탈출 여부는 역학적 에너지 E = K + U로 판단합니다. " +
          "천체 표면에서 U = −g₀Rm이고, " +
          "탈출 속도는 E = 0이 되는 최소 속력입니다. " +
          "따라서 발사 속력이 탈출 속도보다 작으면 E < 0이 되어 " +
          "물체는 최고점에 도달한 뒤 다시 천체로 떨어집니다."
      }

    };

    const get = (id) => document.getElementById(id);

    const modeModal = get("modeModal");
    const formulaModal = get("formulaModal");

    const modeSelect = get("mode");
    const modeBadge = get("modeBadge");

    const speedInput = get("speed");
    const massInput = get("mass");
    const angleInput = get("angle");

    const accelerationXInput = get("accelerationX");
    const accelerationYInput = get("accelerationY");

    const gravitySelect = get("gravity");

    const freefallHeightInput = get("freefallHeight");
    const frictionInput = get("frictionCoefficient");

    const radiusInput = get("radius");
    const angularVelocityInput = get("angularVelocity");

    const inclineAngleInput = get("inclineAngle");
    const inclineFrictionInput = get("inclineFriction");

    const planetGravityInput = get("planetGravity");
    const planetRadiusInput = get("planetRadius");

    const useEscapeSpeedInput = get("useEscapeSpeed");
    const escapeViewSelect = get("escapeView");

    const zoomSlider = get("zoomSlider");
    const showTrailInput = get("showTrail");

    const startButton = get("start");
    const playPauseButton = get("playPause");
    const resetButton = get("reset");

    const message = get("message");
    const energyStatus = get("energyStatus");

    const formulaText = get("formulaText");
    const physicsInfo = get("physicsInfo");

    const simulation = get("simulation");
    const canvas = get("canvas");
    const context = canvas.getContext("2d");

    let running = false;

    let elapsed = 0;

    let x = 0;
    let y = 0;

    let velocityX = 0;
    let velocityY = 0;

    let accelerationX = 0;
    let accelerationY = 0;

    let circularAngle = 0;

    let trail = [];

    let zoom = 1;

    let cameraX = 0;
    let cameraY = 0;

    let previousTime = performance.now();

    let inclineDistance = 0;
    let inclineVelocity = 0;

    const MIN_ZOOM = 0.02;
    const MAX_ZOOM = 50;

    const ENERGY_EPSILON = 0.05;

    // 탈출 판정의 기준이 되는 초기 역학적 에너지.
    // 수치 적분 오차 때문에 E<0 물체가 장시간 후 E>0으로
    // 잘못 판정되는 것을 막습니다.
    let escapeInitialEnergy = null;


    function numberValue(input, fallback = 0) {
      const value = Number(input.value);

      return Number.isFinite(value)
        ? value
        : fallback;
    }


    function currentMode() {
      return MODES[modeSelect.value];
    }


    /*
      탈출 속도

      v_escape = √(2g₀R)
    */
    function computeEscapeSpeed() {

      const surfaceGravity =
        Math.max(
          numberValue(planetGravityInput, 9.8),
          0.0001
        );

      const planetRadius =
        Math.max(
          numberValue(planetRadiusInput, 35),
          1
        );

      return Math.sqrt(
        2 * surfaceGravity * planetRadius
      );
    }


    /*
      탈출 모드의 중력 퍼텐셜 에너지

      GM = g₀R²

      U = -GMm/r

        = -g₀R²m/r
    */
    function computeEscapePotentialEnergy() {

      const mass =
        Math.max(
          numberValue(massInput, 1),
          0.01
        );

      const surfaceGravity =
        Math.max(
          numberValue(planetGravityInput, 9.8),
          0.0001
        );

      const planetRadius =
        Math.max(
          numberValue(planetRadiusInput, 35),
          1
        );

      const distanceFromCenter =
        Math.max(
          Math.hypot(x, y),
          0.0001
        );

      return (
        -surfaceGravity *
        planetRadius *
        planetRadius *
        mass /
        distanceFromCenter
      );
    }


    /*
      탈출 모드의 역학적 에너지

      E = K + U
    */
    function computeEscapeMechanicalEnergy() {

      const mass =
        Math.max(
          numberValue(massInput, 1),
          0.01
        );

      const speed =
        Math.hypot(
          velocityX,
          velocityY
        );

      const kineticEnergy =
        0.5 * mass * speed * speed;

      const potentialEnergy =
        computeEscapePotentialEnergy();

      return kineticEnergy + potentialEnergy;
    }


    function updateEnergyStatus() {

      if (modeSelect.value !== "escape") {

        energyStatus.className = "";
        energyStatus.textContent = "";

        return;
      }

      const energy =
        computeEscapeMechanicalEnergy();

      if (energy > ENERGY_EPSILON) {

        energyStatus.className = "escape";

        energyStatus.textContent =
          "E > 0 · 탈출 가능";

      } else if (energy < -ENERGY_EPSILON) {

        energyStatus.className = "bound";

        energyStatus.textContent =
          "E < 0 · 중력에 묶임";

      } else {

        energyStatus.className = "minimum";

        energyStatus.textContent =
          "E ≈ 0 · 최소 탈출 조건";
      }
    }


    function updateModeInterface() {

      const mode = modeSelect.value;
      const data = currentMode();

      modeBadge.textContent = data.name;

      formulaText.textContent = data.formula;

      get("freefallSettings")
        .classList
        .toggle(
          "active",
          mode === "freefall"
        );

      get("frictionSettings")
        .classList
        .toggle(
          "active",
          mode === "friction"
        );

      get("circularSettings")
        .classList
        .toggle(
          "active",
          mode === "circular"
        );

      get("inclineSettings")
        .classList
        .toggle(
          "active",
          mode === "incline"
        );

      get("escapeSettings")
        .classList
        .toggle(
          "active",
          mode === "escape"
        );

      get("noExtraSettings").style.display =
        mode === "projectile"
          ? "block"
          : "none";

      updateEnergyStatus();
    }


    function selectMode(mode) {

      if (!MODES[mode]) {
        return;
      }

      modeSelect.value = mode;

      speedInput.value =
        MODES[mode].speed;

      angleInput.value =
        MODES[mode].angle;

      updateModeInterface();

      resetSimulation(true);

      modeModal.classList.add("hidden");

      message.textContent =
        `${MODES[mode].name} 모드가 선택되었습니다.`;
    }


    function resizeCanvas() {

      const rectangle =
        simulation.getBoundingClientRect();

      const ratio =
        Math.min(
          window.devicePixelRatio || 1,
          2
        );

      canvas.width =
        Math.max(
          1,
          Math.round(rectangle.width * ratio)
        );

      canvas.height =
        Math.max(
          1,
          Math.round(rectangle.height * ratio)
        );

      canvas.style.width =
        `${rectangle.width}px`;

      canvas.style.height =
        `${rectangle.height}px`;

      context.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
      );
    }


    function autoFitEscapeZoom() {

      const planetRadius =
        Math.max(
          numberValue(planetRadiusInput, 35),
          1
        );

      const baseScale =
        Math.max(
          5,
          simulation.clientWidth / 80
        );

      const desiredScreenRadius =
        Math.min(
          simulation.clientWidth,
          simulation.clientHeight
        ) * 0.32;

      return Math.min(
        Math.max(
          desiredScreenRadius /
          (planetRadius * baseScale),
          MIN_ZOOM
        ),
        MAX_ZOOM
      );
    }


    function setZoom(nextZoom) {

      zoom =
        Math.min(
          Math.max(
            nextZoom,
            MIN_ZOOM
          ),
          MAX_ZOOM
        );

      const t =
        Math.log(
          zoom / MIN_ZOOM
        ) /
        Math.log(
          MAX_ZOOM / MIN_ZOOM
        );

      zoomSlider.value =
        (
          Math.min(
            Math.max(t, 0),
            1
          ) * 100
        ).toFixed(1);
    }


    function updateCamera() {

      const mode =
        modeSelect.value;

      if (
        mode === "escape" &&
        escapeViewSelect.value === "object"
      ) {

        cameraX = x;
        cameraY = y;

      } else {

        cameraX = 0;
        cameraY = 0;
      }
    }


    function resetSimulation(resetZoom = false) {

      running = false;

      elapsed = 0;

      trail = [];

      const mode =
        modeSelect.value;

      if (mode !== "escape") {
        escapeInitialEnergy = null;
      }

      const speed =
        numberValue(speedInput);

      const angle =
        numberValue(angleInput) *
        Math.PI / 180;

      x = -20;
      y = 1;

      velocityX =
        speed * Math.cos(angle);

      velocityY =
        speed * Math.sin(angle);

      accelerationX =
        numberValue(
          accelerationXInput
        );

      accelerationY =
        numberValue(
          accelerationYInput
        ) -
        numberValue(
          gravitySelect,
          9.8
        );


      /* 자유 낙하 */

      if (mode === "freefall") {

        x = 0;

        y =
          numberValue(
            freefallHeightInput,
            25
          );

        velocityX = 0;

        velocityY =
          -Math.abs(speed);
      }


      /* 마찰 운동 */

      if (mode === "friction") {

        x = -20;
        y = 1;

        velocityY = 0;

        accelerationY = 0;
      }


      /* 원운동 */

      if (mode === "circular") {

        const radius =
          Math.max(
            numberValue(
              radiusInput,
              10
            ),
            1
          );

        circularAngle = 0;

        x = radius;
        y = 8;
      }


      /* 빗면 */

      if (mode === "incline") {

        inclineDistance = 0;

        inclineVelocity = 0;

        x = 0;
        y = 0;
      }


      /*
        탈출 속도

        여기서 체크박스가 켜져 있으면
        자동으로 v_escape를 넣습니다.

        체크박스를 끄면 사용자가 입력한
        속도를 그대로 사용합니다.
      */

      if (mode === "escape") {

        const planetRadius =
          Math.max(
            numberValue(
              planetRadiusInput,
              35
            ),
            1
          );

        x = 0;
        y = planetRadius;

        const escapeSpeed =
          computeEscapeSpeed();

        if (
          useEscapeSpeedInput.checked
        ) {

          speedInput.value =
            escapeSpeed.toFixed(2);
        }

        const currentSpeed =
          numberValue(
            speedInput,
            escapeSpeed
          );

        const launchAngle =
          numberValue(
            angleInput,
            90
          ) *
          Math.PI / 180;

        velocityX =
          currentSpeed *
          Math.cos(launchAngle);

        velocityY =
          currentSpeed *
          Math.sin(launchAngle);

        /*
          초기 에너지에 따른 상태 표시
        */

        escapeInitialEnergy =
          computeEscapeMechanicalEnergy();

        const energy =
          escapeInitialEnergy;

        if (energy > ENERGY_EPSILON) {

          message.textContent =
            "E > 0 : 물체가 탈출합니다.";

        } else if (
          energy < -ENERGY_EPSILON
        ) {

          message.textContent =
            "E < 0 : 물체가 다시 행성으로 떨어집니다.";

        } else {

          message.textContent =
            "E ≈ 0 : 최소 탈출 조건입니다.";
        }
      }


      if (resetZoom) {

        setZoom(
          mode === "escape"
            ? autoFitEscapeZoom()
            : 1
        );
      }

      playPauseButton.textContent =
        "▶ 재생";

      updatePhysicsInfo();

      draw();
    }


    function update(deltaTime) {

      const mode =
        modeSelect.value;

      const gravity =
        numberValue(
          gravitySelect,
          9.8
        );


      /* =========================
         원운동
         ========================= */

      if (mode === "circular") {

        const radius =
          Math.max(
            numberValue(
              radiusInput,
              10
            ),
            1
          );

        const omega =
          numberValue(
            angularVelocityInput,
            1
          );

        circularAngle +=
          omega * deltaTime;

        x =
          radius *
          Math.cos(circularAngle);

        y =
          8 +
          radius *
          Math.sin(circularAngle);

        velocityX =
          -radius *
          omega *
          Math.sin(circularAngle);

        velocityY =
          radius *
          omega *
          Math.cos(circularAngle);

        accelerationX =
          -radius *
          omega *
          omega *
          Math.cos(circularAngle);

        accelerationY =
          -radius *
          omega *
          omega *
          Math.sin(circularAngle);


      /*
        =========================
        빗면 운동
        =========================
      */

      } else if (mode === "incline") {

        const inclineAngle =
          Math.max(
            0,
            Math.min(
              89,
              numberValue(
                inclineAngleInput,
                30
              )
            )
          ) *
          Math.PI / 180;

        const frictionCoefficient =
          Math.max(
            numberValue(
              inclineFrictionInput,
              0.2
            ),
            0
          );

        const gravityComponent =
          gravity *
          Math.sin(inclineAngle);

        const normalForceComponent =
          gravity *
          Math.cos(inclineAngle);

        let frictionAcceleration =
          frictionCoefficient *
          normalForceComponent;

        if (
          Math.abs(inclineVelocity) <
          0.0005
        ) {

          if (
            gravityComponent <=
            frictionAcceleration
          ) {

            inclineVelocity = 0;

            frictionAcceleration =
              gravityComponent;

          } else {

            frictionAcceleration =
              frictionCoefficient *
              normalForceComponent;
          }

        } else {

          frictionAcceleration =
            Math.sign(inclineVelocity) *
            frictionCoefficient *
            normalForceComponent;
        }

        const inclineAcceleration =
          gravityComponent -
          frictionAcceleration;

        inclineVelocity +=
          inclineAcceleration *
          deltaTime;

        inclineDistance +=
          inclineVelocity *
          deltaTime;

        if (inclineDistance < 0) {

          inclineDistance = 0;

          inclineVelocity = 0;
        }

        x =
          inclineDistance *
          Math.cos(inclineAngle);

        y =
          Math.max(
            numberValue(
              radiusInput,
              10
            ),
            10
          ) -
          inclineDistance *
          Math.sin(inclineAngle);

        velocityX =
          inclineVelocity *
          Math.cos(inclineAngle);

        velocityY =
          -inclineVelocity *
          Math.sin(inclineAngle);

        accelerationX =
          inclineAcceleration *
          Math.cos(inclineAngle);

        accelerationY =
          -inclineAcceleration *
          Math.sin(inclineAngle);

        if (
          inclineDistance > 0 &&
          y <= 0.01
        ) {

          running = false;

          playPauseButton.textContent =
            "▶ 재생";

          message.textContent =
            "물체가 빗면 끝에 도달했습니다.";
        }


      /*
        =========================
        탈출 속도
        =========================
      */

      } else if (mode === "escape") {

        const surfaceGravity =
          Math.max(
            numberValue(
              planetGravityInput,
              9.8
            ),
            0.0001
          );

        const planetRadius =
          Math.max(
            numberValue(
              planetRadiusInput,
              35
            ),
            1
          );

        const distanceFromCenter =
          Math.max(
            Math.hypot(x, y),
            0.01
          );

        /*
          g(r) = g₀R²/r²
        */

        const gravitationalAcceleration =
          surfaceGravity *
          planetRadius *
          planetRadius /
          (
            distanceFromCenter *
            distanceFromCenter
          );

        /*
          중력 방향은 항상
          행성 중심 방향
        */

        accelerationX =
          -gravitationalAcceleration *
          (
            x /
            distanceFromCenter
          );

        accelerationY =
          -gravitationalAcceleration *
          (
            y /
            distanceFromCenter
          );

        // Velocity Verlet:
        // 단순 Euler 적분은 장시간 시뮬레이션에서 에너지를 인위적으로
        // 증가시켜 탈출 불가(v0 < v_escape) 물체가 탈출하는 문제가 생길 수 있습니다.
        const oldAccelerationX = accelerationX;
        const oldAccelerationY = accelerationY;

        x +=
          velocityX * deltaTime +
          0.5 * oldAccelerationX * deltaTime * deltaTime;

        y +=
          velocityY * deltaTime +
          0.5 * oldAccelerationY * deltaTime * deltaTime;

        const newDistanceForAcceleration =
          Math.max(Math.hypot(x, y), 0.01);

        const newGravitationalAcceleration =
          surfaceGravity *
          planetRadius *
          planetRadius /
          (
            newDistanceForAcceleration *
            newDistanceForAcceleration
          );

        const newAccelerationX =
          -newGravitationalAcceleration *
          (x / newDistanceForAcceleration);

        const newAccelerationY =
          -newGravitationalAcceleration *
          (y / newDistanceForAcceleration);

        velocityX +=
          0.5 *
          (oldAccelerationX + newAccelerationX) *
          deltaTime;

        velocityY +=
          0.5 *
          (oldAccelerationY + newAccelerationY) *
          deltaTime;

        accelerationX = newAccelerationX;
        accelerationY = newAccelerationY;


        /*
          행성 표면과 충돌
        */

        const newDistance =
          Math.max(
            Math.hypot(x, y),
            0.0001
          );

        if (
          newDistance <
          planetRadius
        ) {

          const pushOut =
            planetRadius /
            newDistance;

          x *= pushOut;
          y *= pushOut;

          velocityX = 0;
          velocityY = 0;

          running = false;

          playPauseButton.textContent =
            "▶ 재생";

          message.textContent =
            "E < 0 : 물체가 행성 표면으로 돌아왔습니다.";
        }


        /*
          역학적 에너지에 따른
          실시간 상태 표시
        */

        updateEnergyStatus();


      /*
        =========================
        일반 운동
        =========================
      */

      } else {

        accelerationX =
          numberValue(
            accelerationXInput
          );

        accelerationY =
          numberValue(
            accelerationYInput
          );

        if (
          mode === "projectile" ||
          mode === "freefall"
        ) {

          accelerationY -= gravity;
        }

        if (mode === "friction") {

          const coefficient =
            Math.max(
              numberValue(
                frictionInput,
                0.3
              ),
              0
            );

          if (
            Math.abs(velocityX) >
            0.001
          ) {

            accelerationX -=
              Math.sign(velocityX) *
              coefficient *
              gravity;
          }

          accelerationY = 0;
        }

        const oldVelocityX =
          velocityX;

        velocityX +=
          accelerationX *
          deltaTime;

        velocityY +=
          accelerationY *
          deltaTime;

        if (
          mode === "friction" &&
          oldVelocityX !== 0 &&
          Math.sign(oldVelocityX) !==
            Math.sign(velocityX)
        ) {

          velocityX = 0;
        }

        x +=
          velocityX *
          deltaTime;

        y +=
          velocityY *
          deltaTime;


        /*
          지면 충돌
        */

        if (y < 1) {

          y = 1;

          if (mode === "projectile") {

            velocityY *= -0.5;

            if (
              Math.abs(velocityY) <
              0.08
            ) {

              velocityY = 0;
            }

          } else {

            velocityY = 0;

            running = false;

            playPauseButton.textContent =
              "▶ 재생";

            message.textContent =
              "물체가 바닥에 도달해 일시정지했습니다.";
          }
        }


        /*
          마찰로 정지
        */

        if (
          mode === "friction" &&
          Math.abs(velocityX) <
            0.001
        ) {

          velocityX = 0;

          running = false;

          playPauseButton.textContent =
            "▶ 재생";

          message.textContent =
            "마찰력으로 물체가 정지했습니다.";
        }
      }


      elapsed += deltaTime;


      if (showTrailInput.checked) {

        trail.push({
          x,
          y
        });

        if (trail.length > 1500) {
          trail.shift();
        }
      }


      updatePhysicsInfo();


      /*
        화면 밖으로 나간 경우
      */

      const cameraFollowsObject =
        mode === "escape" &&
        escapeViewSelect.value === "object";

      if (!cameraFollowsObject) {

        const screenPoint =
          worldToScreen(x, y);

        if (
          screenPoint.x < -60 ||
          screenPoint.x >
            simulation.clientWidth + 60 ||
          screenPoint.y < -60 ||
          screenPoint.y >
            simulation.clientHeight + 60
        ) {

          /*
            탈출 모드에서 E > 0이면
            화면 밖으로 나간 것이
            곧 탈출 성공을 의미합니다.
          */

          if (mode === "escape") {

            /*
              탈출 여부는 "현재" 역학적 에너지가 아니라
              시작 시점의 역학적 에너지(escapeInitialEnergy)로
              판정합니다. 수치 적분 오차가 누적되어도
              탈출/구속 여부 자체는 초기 조건에 의해서만
              결정되기 때문입니다.

              설정값(행성 중력, 반지름, 질량, 속력, 각도)에 따라
              아래 세 가지 결과가 모두 나올 수 있어야 합니다.

                1) E > 0  : 탈출 성공  (v0 > v_escape)
                2) E ≈ 0  : 최소 탈출 조건으로 탈출 (v0 = v_escape)
                3) E < 0  : 탈출하지 못함 (v0 < v_escape) →
                            화면 밖으로 나가더라도 결국 되돌아오므로
                            "탈출"로 판정하지 않는다.
            */

            if (escapeInitialEnergy === null) {

              // 초기 에너지가 아직 계산되지 않은 예외 상황.
              running = false;

              playPauseButton.textContent =
                "▶ 재생";

              message.textContent =
                "물체가 화면 밖으로 이동해 일시정지했습니다. 화면을 축소하세요.";

            } else if (
              escapeInitialEnergy >
              ENERGY_EPSILON
            ) {

              // 1) E > 0 : 탈출 성공
              running = false;

              playPauseButton.textContent =
                "▶ 재생";

              message.textContent =
                "E > 0 : 물체가 중력을 벗어나 탈출했습니다.";

            } else if (
              escapeInitialEnergy <
              -ENERGY_EPSILON
            ) {

              // 3) E < 0 : 탈출 실패 (구속됨)
              // 화면 밖으로 나갔더라도 탈출한 것이 아니라
              // 타원 궤도의 먼 지점을 지나는 중이거나
              // 잠시 뒤 다시 행성 쪽으로 떨어질 것이므로
              // "탈출"로 표시하지 않고, 관찰을 위해 일시정지만 한다.
              running = false;

              playPauseButton.textContent =
                "▶ 재생";

              message.textContent =
                "E < 0 : 물체가 탈출하지 못하고 화면 밖으로 벗어났습니다. 화면을 축소해 다시 확인하세요.";

            } else {

              // 2) E ≈ 0 : 최소 탈출 조건
              // 속도가 0에 무한히 가까워지며 다시는 돌아오지 않으므로
              // 탈출로 판정한다.
              running = false;

              playPauseButton.textContent =
                "▶ 재생";

              message.textContent =
                "E ≈ 0 : 최소 탈출 조건으로 물체가 탈출했습니다.";
            }

          } else {

            running = false;

            playPauseButton.textContent =
              "▶ 재생";

            message.textContent =
              "물체가 화면 밖으로 이동해 일시정지했습니다. 화면을 축소하세요.";
          }
        }
      }
    }


    function worldToScreen(
      worldX,
      worldY
    ) {

      const scale =
        Math.max(
          5,
          simulation.clientWidth / 80
        ) *
        zoom;

      const verticalAnchor =
        modeSelect.value === "escape"
          ? 0.5
          : 0.75;

      return {

        x:
          simulation.clientWidth / 2 +
          (
            worldX - cameraX
          ) *
          scale,

        y:
          simulation.clientHeight *
          verticalAnchor -
          (
            worldY - cameraY
          ) *
          scale
      };
    }


    function drawBall(
      screenX,
      screenY,
      radius
    ) {

      context.beginPath();

      context.arc(
        screenX,
        screenY,
        radius,
        0,
        Math.PI * 2
      );

      context.fillStyle =
        "#ffda3d";

      context.fill();

      context.strokeStyle =
        "#ffffff";

      context.lineWidth = 2;

      context.stroke();
    }


    function draw() {

      const width =
        simulation.clientWidth;

      const height =
        simulation.clientHeight;

      const mode =
        modeSelect.value;

      updateCamera();

      context.clearRect(
        0,
        0,
        width,
        height
      );


      /*
        배경
      */

      const background =
        context.createLinearGradient(
          0,
          0,
          0,
          height
        );

      background.addColorStop(
        0,
        "#0a1d35"
      );

      background.addColorStop(
        1,
        "#020811"
      );

      context.fillStyle =
        background;

      context.fillRect(
        0,
        0,
        width,
        height
      );


      /*
        일반 지면
      */

      if (
        mode !== "circular" &&
        mode !== "incline" &&
        mode !== "escape"
      ) {

        const ground =
          worldToScreen(0, 0);

        context.fillStyle =
          "#5e6873";

        context.fillRect(
          0,
          ground.y,
          width,
          height - ground.y
        );
      }


      /*
        원운동
      */

      if (mode === "circular") {

        const radius =
          Math.max(
            numberValue(
              radiusInput,
              10
            ),
            1
          );

        const center =
          worldToScreen(0, 8);

        const circleRadius =
          radius *
          Math.max(
            5,
            width / 80
          ) *
          zoom;

        context.beginPath();

        context.arc(
          center.x,
          center.y,
          circleRadius,
          0,
          Math.PI * 2
        );

        context.strokeStyle =
          "rgba(79,156,214,0.8)";

        context.lineWidth = 2;

        context.stroke();
      }


      /*
        빗면
      */

      if (mode === "incline") {

        const inclineAngle =
          Math.max(
            0,
            Math.min(
              89,
              numberValue(
                inclineAngleInput,
                30
              )
            )
          ) *
          Math.PI / 180;

        const rampHeight =
          Math.max(
            numberValue(
              radiusInput,
              10
            ),
            10
          );

        const rampLength =
          rampHeight /
          Math.tan(
            inclineAngle || 0.01
          );

        const top =
          worldToScreen(
            0,
            rampHeight
          );

        const bottom =
          worldToScreen(
            0,
            0
          );

        const right =
          worldToScreen(
            rampLength,
            0
          );

        context.beginPath();

        context.moveTo(
          top.x,
          top.y
        );

        context.lineTo(
          bottom.x,
          bottom.y
        );

        context.lineTo(
          right.x,
          right.y
        );

        context.closePath();

        context.fillStyle =
          "rgba(94,104,115,0.85)";

        context.fill();

        context.strokeStyle =
          "#8fa5bb";

        context.lineWidth = 2;

        context.stroke();
      }


      /*
        행성
      */

      if (mode === "escape") {

        const planetRadius =
          Math.max(
            numberValue(
              planetRadiusInput,
              35
            ),
            1
          );

        const center =
          worldToScreen(
            0,
            0
          );

        const surfacePoint =
          worldToScreen(
            0,
            planetRadius
          );

        const displayRadius =
          Math.abs(
            surfacePoint.y -
            center.y
          );


        /*
          행성 글로우
        */

        const glow =
          context.createRadialGradient(
            center.x,
            center.y,
            displayRadius * 0.7,
            center.x,
            center.y,
            displayRadius * 1.5
          );

        glow.addColorStop(
          0,
          "rgba(61,111,168,0.2)"
        );

        glow.addColorStop(
          1,
          "rgba(61,111,168,0)"
        );

        context.fillStyle =
          glow;

        context.beginPath();

        context.arc(
          center.x,
          center.y,
          displayRadius * 1.5,
          0,
          Math.PI * 2
        );

        context.fill();


        /*
          행성 본체
        */

        context.beginPath();

        context.arc(
          center.x,
          center.y,
          displayRadius,
          0,
          Math.PI * 2
        );

        context.fillStyle =
          "#3d6fa8";

        context.fill();

        context.strokeStyle =
          "#9fd6ff";

        context.lineWidth = 2;

        context.stroke();
      }


      /*
        궤적
      */

      if (
        showTrailInput.checked &&
        trail.length > 1
      ) {

        context.beginPath();

        trail.forEach(
          (point, index) => {

            const screen =
              worldToScreen(
                point.x,
                point.y
              );

            if (index === 0) {

              context.moveTo(
                screen.x,
                screen.y
              );

            } else {

              context.lineTo(
                screen.x,
                screen.y
              );
            }
          }
        );

        context.strokeStyle =
          "#ff9f25";

        context.lineWidth = 2;

        context.stroke();
      }


      /*
        물체
      */

      const point =
        worldToScreen(
          x,
          y
        );

      const ballRadius =
        mode === "escape"
          ? Math.max(
              3,
              4 * Math.sqrt(zoom)
            )
          : Math.max(
              8,
              10 * zoom
            );

      drawBall(
        point.x,
        point.y,
        ballRadius
      );
    }


    function row(
      name,
      value,
      className = ""
    ) {

      return `
        <div class="physics-row">
          <span class="physics-name">
            ${name}
          </span>

          <span class="physics-value ${className}">
            ${value}
          </span>
        </div>
      `;
    }


    function updatePhysicsInfo() {

      const mass =
        Math.max(
          numberValue(
            massInput,
            1
          ),
          0.01
        );

      const speed =
        Math.hypot(
          velocityX,
          velocityY
        );

      const forceX =
        mass * accelerationX;

      const forceY =
        mass * accelerationY;

      const kineticEnergy =
        0.5 *
        mass *
        speed *
        speed;

      let potentialEnergy;

      let mechanicalEnergy;

      /*
        탈출 모드
      */

      if (
        modeSelect.value === "escape"
      ) {

        potentialEnergy =
          computeEscapePotentialEnergy();

        mechanicalEnergy =
          kineticEnergy +
          potentialEnergy;

      } else {

        const gravity =
          numberValue(
            gravitySelect,
            9.8
          );

        potentialEnergy =
          mass *
          gravity *
          Math.max(
            y - 1,
            0
          );

        mechanicalEnergy =
          kineticEnergy +
          potentialEnergy;
      }


      let energyClass = "";

      if (
        modeSelect.value === "escape"
      ) {

        if (
          mechanicalEnergy >
          ENERGY_EPSILON
        ) {

          energyClass =
            "energy-positive";

        } else if (
          mechanicalEnergy <
          -ENERGY_EPSILON
        ) {

          energyClass =
            "energy-negative";

        } else {

          energyClass =
            "energy-zero";
        }
      }


      let extraRow = "";

      if (
        modeSelect.value === "escape"
      ) {

        const escapeSpeed =
          computeEscapeSpeed();

        extraRow =
          row(
            "탈출 속도",
            `${escapeSpeed.toFixed(2)} m·s⁻¹`
          );
      }


      physicsInfo.innerHTML =

        row(
          "시간 t",
          `${elapsed.toFixed(2)} s`
        ) +

        row(
          "위치 r⃗",
          `(${x.toFixed(2)}, ${y.toFixed(2)}) m`
        ) +

        row(
          "속도 v⃗",
          `(${velocityX.toFixed(2)}, ${velocityY.toFixed(2)}) m·s⁻¹`
        ) +

        row(
          "가속도 a⃗",
          `(${accelerationX.toFixed(2)}, ${accelerationY.toFixed(2)}) m·s⁻²`
        ) +

        row(
          "알짜힘 F⃗",
          `(${forceX.toFixed(2)}, ${forceY.toFixed(2)}) N`
        ) +

        row(
          "운동에너지 K",
          `${kineticEnergy.toFixed(2)} J`
        ) +

        row(
          "위치에너지 U",
          `${potentialEnergy.toFixed(2)} J`
        ) +

        row(
          "역학적 에너지 E",
          `${mechanicalEnergy.toFixed(2)} J`,
          energyClass
        ) +

        extraRow;


      updateEnergyStatus();
    }


    /*
      운동 선택
    */

    document
      .querySelectorAll("[data-mode]")
      .forEach(
        (button) => {

          button.addEventListener(
            "click",
            () => {

              selectMode(
                button.dataset.mode
              );
            }
          );
        }
      );


    /*
      셀렉트로 운동 변경
    */

    modeSelect.addEventListener(
      "change",
      () => {

        updateModeInterface();

        resetSimulation(true);
      }
    );


    /*
      운동 다시 선택
    */

    get("openMode")
      .addEventListener(
        "click",
        () => {

          running = false;

          modeModal.classList.remove(
            "hidden"
          );
        }
      );


    /*
      처음부터
    */

    startButton.addEventListener(
      "click",
      () => {

        resetSimulation();

        running = true;

        playPauseButton.textContent =
          "Ⅱ 일시정지";

        if (
          modeSelect.value ===
          "escape"
        ) {

          const energy =
            computeEscapeMechanicalEnergy();

          if (
            energy >
            ENERGY_EPSILON
          ) {

            message.textContent =
              "E > 0 · 탈출 운동 실행 중";

          } else if (
            energy <
            -ENERGY_EPSILON
          ) {

            message.textContent =
              "E < 0 · 탈출하지 못하고 다시 떨어집니다.";

          } else {

            message.textContent =
              "E ≈ 0 · 최소 탈출 조건으로 실행 중";
          }

        } else {

          message.textContent =
            `${currentMode().name} 실행 중`;
        }
      }
    );


    /*
      재생 / 일시정지
    */

    playPauseButton.addEventListener(
      "click",
      () => {

        running = !running;

        playPauseButton.textContent =
          running
            ? "Ⅱ 일시정지"
            : "▶ 재생";

        message.textContent =
          running
            ? "시뮬레이션 실행 중"
            : "일시정지되었습니다.";
      }
    );


    /*
      초기화
    */

    resetButton.addEventListener(
      "click",
      () => {

        resetSimulation();

        message.textContent =
          "초기화되었습니다.";
      }
    );


    /*
      줌
    */

    get("zoomIn")
      .addEventListener(
        "click",
        () => {

          setZoom(
            zoom * 1.25
          );
        }
      );


    get("zoomOut")
      .addEventListener(
        "click",
        () => {

          setZoom(
            zoom / 1.25
          );
        }
      );


    get("fitView")
      .addEventListener(
        "click",
        () => {

          setZoom(
            modeSelect.value ===
            "escape"
              ? autoFitEscapeZoom()
              : 1
          );
        }
      );


    zoomSlider.addEventListener(
      "input",
      () => {

        const t =
          Number(
            zoomSlider.value
          ) / 100;

        zoom =
          MIN_ZOOM *
          Math.pow(
            MAX_ZOOM / MIN_ZOOM,
            t
          );
      }
    );


    /*
      마우스 휠 줌
    */

    simulation.addEventListener(
      "wheel",
      (event) => {

        event.preventDefault();

        if (event.deltaY < 0) {

          setZoom(
            zoom * 1.1
          );

        } else {

          setZoom(
            zoom / 1.1
          );
        }
      },
      {
        passive: false
      }
    );


    /*
      공식 설명
    */

    get("showFormula")
      .addEventListener(
        "click",
        () => {

          const data =
            currentMode();

          get("formulaTitle")
            .textContent =
            data.name;

          get("formulaDescription")
            .innerHTML =

              `<h3>핵심 공식</h3>` +

              `<pre>${data.formula}</pre>` +


          `<h3>설명</h3>` +

          `<p>${data.explanation}</p>`;

      formulaModal
        .classList
        .remove("hidden");
    }
  );


/*
  공식 창 닫기
*/

get("closeFormula")
  .addEventListener(
    "click",
    () => {

      formulaModal
        .classList
        .add("hidden");
    }
  );


/*
  탈출 설정 변경
*/

[
  planetGravityInput,
  planetRadiusInput,
  massInput,
  speedInput,
  angleInput,
  useEscapeSpeedInput
].forEach(
  (element) => {

    element.addEventListener(
      "input",
      () => {

        if (
          modeSelect.value ===
          "escape"
        ) {

          if (
            useEscapeSpeedInput.checked &&
            (
              element ===
                planetGravityInput ||
              element ===
                planetRadiusInput
            )
          ) {

            speedInput.value =
              computeEscapeSpeed()
                .toFixed(2);
          }

          resetSimulation();
        }
      }
    );
  }
);


escapeViewSelect.addEventListener(
  "change",
  () => {

    updateCamera();

    draw();
  }
);


/*
  화면 크기 변경
*/

window.addEventListener(
  "resize",
  () => {

    resizeCanvas();

    draw();
  }
);


/*
  애니메이션
*/

function animate(now) {

  requestAnimationFrame(
    animate
  );

  const deltaTime =
    Math.min(
      (now - previousTime) / 1000,
      0.03
    );

  previousTime = now;

  if (running) {

    update(
      deltaTime
    );
  }

  draw();
}


/*
  초기 실행
*/

resizeCanvas();

updateModeInterface();

resetSimulation(true);

requestAnimationFrame(
  animate
);
