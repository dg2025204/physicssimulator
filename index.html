<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Physics Simulator</title>

  <style>
    :root {
      color-scheme: dark;
      font-family:
        Pretendard,
        "Noto Sans KR",
        Arial,
        sans-serif;

      --background: #06101d;
      --panel: #10243a;
      --panel-hover: #17476d;
      --border: #36506f;
      --primary: #39c7ff;
      --text: #f7fbff;
      --muted: #a5b6ca;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-width: 320px;
      min-height: 100%;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
    }

    /* 체크박스 자체는 화면에서 숨김 */
    #modeWindowState {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    /* 최초 운동 선택 창 */
    #modeModal {
      position: fixed;
      z-index: 999999;
      inset: 0;

      padding: 24px;
      display: grid;
      place-items: center;

      background:
        radial-gradient(
          circle at 50% 10%,
          rgb(36 123 181 / 38%),
          transparent 45%
        ),
        rgb(2 8 18 / 96%);
    }

    /* 체크 해제 시 창 숨김 */
    #modeWindowState:not(:checked) + #modeModal {
      display: none;
    }

    .mode-dialog {
      width: min(1050px, 96vw);
      max-height: 92vh;
      padding: 42px;
      overflow-y: auto;

      border: 1px solid rgb(255 255 255 / 15%);
      border-radius: 26px;

      background:
        linear-gradient(
          145deg,
          #172f4b,
          #091a2e 60%,
          #06111f
        );

      box-shadow: 0 40px 120px rgb(0 0 0 / 65%);
    }

    .eyebrow {
      margin: 0;
      color: var(--primary);

      text-align: center;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.15em;
    }

    .mode-dialog h1 {
      margin: 9px 0 10px;

      text-align: center;
      font-size: clamp(1.7rem, 4vw, 2.8rem);
    }

    .description {
      margin: 0 0 30px;

      color: var(--muted);
      text-align: center;
      font-size: 0.93rem;
    }

    .mode-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .mode-card {
      min-width: 0;
      min-height: 180px;
      padding: 23px 19px;

      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 11px;

      border: 1px solid var(--border);
      border-radius: 19px;

      background:
        linear-gradient(
          145deg,
          #102944,
          #081a2e
        );

      color: var(--text);
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;

      transition:
        transform 150ms ease,
        border-color 150ms ease,
        background 150ms ease;
    }

    .mode-card:hover {
      transform: translateY(-6px);
      border-color: var(--primary);
      background: var(--panel-hover);
    }

    .mode-card:active {
      transform: scale(0.98);
    }

    .mode-icon {
      min-width: 58px;
      height: 58px;
      padding: 0 9px;

      display: grid;
      place-items: center;

      border-radius: 16px;
      background: rgb(57 199 255 / 13%);

      color: var(--primary);
      font-size: 1.55rem;
      font-weight: 900;
    }

    .mode-card strong {
      font-size: 1.05rem;
    }

    .mode-card small {
      color: var(--muted);
      font-size: 0.77rem;
    }

    /* 모달 뒤 기본 페이지 */
    header {
      min-height: 72px;
      padding: 12px 22px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;

      border-bottom: 1px solid var(--border);
      background: #091625;
    }

    header h1 {
      margin: 0;
      font-size: 1.2rem;
    }

    .reopen-button {
      min-height: 40px;
      padding: 0 14px;

      display: grid;
      place-items: center;

      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel);

      cursor: pointer;
    }

    main {
      min-height: calc(100vh - 72px);
      padding: 30px;

      display: grid;
      place-items: center;

      text-align: center;
    }

    .test-panel {
      width: min(650px, 100%);
      padding: 32px;

      border: 1px solid var(--border);
      border-radius: 20px;
      background: #0b192b;
    }

    .test-panel h2 {
      margin-top: 0;
    }

    .test-panel p {
      color: var(--muted);
      line-height: 1.7;
    }

    @media (max-width: 800px) {
      .mode-dialog {
        padding: 28px;
      }

      .mode-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .mode-card {
        min-height: 155px;
      }
    }

    @media (max-width: 500px) {
      #modeModal {
        padding: 8px;
      }

      .mode-dialog {
        width: 100%;
        padding: 22px 12px;
        border-radius: 18px;
      }

      .mode-grid {
        gap: 8px;
      }

      .mode-card {
        min-height: 135px;
        padding: 15px 12px;
      }

      .mode-card small {
        display: none;
      }
    }
  </style>
</head>

<body>
  <!-- 최초에는 checked 상태이므로 모달 표시 -->
  <input
    id="modeWindowState"
    type="checkbox"
    checked
    aria-hidden="true"
  >

  <section id="modeModal">
    <div class="mode-dialog">
      <p class="eyebrow">INTERACTIVE PHYSICS LAB</p>

      <h1>어떤 운동을 시뮬레이션할까요?</h1>

      <p class="description">
        큰 버튼을 누르면 선택 창이 닫힙니다.
      </p>

      <div class="mode-grid">
        <label class="mode-card" for="modeWindowState">
          <span class="mode-icon">↗</span>
          <strong>포물선 운동</strong>
          <small>발사 각도와 중력</small>
        </label>

        <label class="mode-card" for="modeWindowState">
          <span class="mode-icon">↓</span>
          <strong>자유 낙하</strong>
          <small>높이와 중력가속도</small>
        </label>

        <label class="mode-card" for="modeWindowState">
          <span class="mode-icon">▰</span>
          <strong>마찰 운동</strong>
          <small>수평면에서의 감속</small>
        </label>

        <label class="mode-card" for="modeWindowState">
          <span class="mode-icon">≋</span>
          <strong>공기저항</strong>
          <small>이차 항력과 바람</small>
        </label>

        <label class="mode-card" for="modeWindowState">
          <span class="mode-icon">● ●</span>
          <strong>충돌</strong>
          <small>두 물체의 질량과 속도</small>
        </label>

        <label class="mode-card" for="modeWindowState">
          <span class="mode-icon">◢</span>
          <strong>빗면 운동</strong>
          <small>경사면 중력과 마찰</small>
        </label>

        <label class="mode-card" for="modeWindowState">
          <span class="mode-icon">↻</span>
          <strong>원운동</strong>
          <small>구심가속도와 각속도</small>
        </label>

        <label class="mode-card" for="modeWindowState">
          <span class="mode-icon">⟲</span>
          <strong>돌림힘</strong>
          <small>τ = Iα 회전 운동</small>
        </label>

        <label class="mode-card" for="modeWindowState">
          <span class="mode-icon">🚀</span>
          <strong>탈출 속도</strong>
          <small>중심천체의 역제곱 중력</small>
        </label>
      </div>
    </div>
  </section>

  <header>
    <h1>Physics Simulator</h1>

    <!-- 이 label을 누르면 체크박스가 다시 선택되어 모달이 열림 -->
    <label class="reopen-button" for="modeWindowState">
      운동 다시 선택
    </label>
  </header>

  <main>
    <section class="test-panel">
      <h2>버튼 작동 확인 페이지</h2>

      <p>
        운동 카드를 클릭해서 이 화면이 보이면 클릭 기능이 정상입니다.
      </p>

      <p>
        오른쪽 위의 <strong>운동 다시 선택</strong>을 누르면 선택 창이
        다시 나타납니다.
      </p>
    </section>
  </main>
</body>
</html>
